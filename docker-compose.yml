version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./model/weights:/app/model/weights:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G